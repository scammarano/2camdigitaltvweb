name: Publish verified signed web release
on:
  push:
    branches: [feat/four-modes-parity-v0419]
    paths: ['.release-assets/**', 'scripts/publish_signed_release.py', 'tests/apk_repository_live_test.php', 'tests/github_public_transport_test.php', '.github/workflows/publish-signed-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed bundle and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_signed_release.py
  verify-live-import:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: signage_import_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptestpass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, zip, openssl, curl
      - name: Check signed APK import from the actual published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f .release-assets/apk-envelope-manifest.json ]; then echo 'Legacy release; no signed APK envelope'; exit 0; fi
          php -r 'file_put_contents("config/config.php", "<?php return ".var_export(["app_url"=>"http://localhost","db_host"=>"127.0.0.1","db_name"=>"signage_import_test","db_user"=>"root","db_pass"=>"testpass"],true).";");'
          php tests/config_tenant_test.php
          php tests/github_public_transport_test.php
          php tests/apk_repository_live_test.php
          php tests/apk_sports_live_test.php
          php tests/apk_turnos_live_test.php
  verify-upgrade-api22:

    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Download exact permanently signed deliveries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/apk21-upgrade
          gh release download apk-v0.4.20-debug --pattern '2Cam_Digital_Signage_v0.4.20_DEBUG.apk' --dir /tmp/apk21-upgrade
          gh release download web-v0.4.30 --pattern '2Cam_Digital_Signage_v0.4.21_DEBUG.apk' --dir /tmp/apk21-upgrade
          python3 -c 'import json,hashlib,pathlib; p=pathlib.Path("/tmp/apk21-upgrade"); m=json.loads(pathlib.Path(".release-assets/apk-envelope-manifest.json").read_text()); assert hashlib.sha256((p/"2Cam_Digital_Signage_v0.4.20_DEBUG.apk").read_bytes()).hexdigest()=="7e3ba66b974ed04f485f6d691a4b367acdff7e9ace018a4489f438c7434387c5"; assert hashlib.sha256((p/"2Cam_Digital_Signage_v0.4.21_DEBUG.apk").read_bytes()).hexdigest()==m["sha256"]'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install /tmp/apk21-upgrade/2Cam_Digital_Signage_v0.4.20_DEBUG.apk
            adb shell run-as com.digitalsignage.tv mkdir -p files
            adb shell "run-as com.digitalsignage.tv sh -c 'echo preserved-v0420 > files/upgrade-proof'"
            adb install -r /tmp/apk21-upgrade/2Cam_Digital_Signage_v0.4.21_DEBUG.apk
            adb shell run-as com.digitalsignage.tv cat files/upgrade-proof | grep -F preserved-v0420
            adb shell dumpsys package com.digitalsignage.tv | grep -F versionName=0.4.21-debug
            echo UPGRADE_20_TO_21_DATA_RETAINED
