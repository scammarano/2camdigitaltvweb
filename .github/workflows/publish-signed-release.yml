name: Publish verified signed web release
on:
  push:
    branches: [feat/four-modes-parity-v0419]
    paths: ['.release-assets/**', 'scripts/publish_signed_release.py', '.github/workflows/publish-signed-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed bundle and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_signed_release.py
