name: Publish verified signed web release
on:
  push:
    branches: [feat/four-modes-parity-v0419, feat/device-log-export-v0431]
    paths: ['.release-assets/**', 'scripts/publish_signed_release.py', 'tests/apk_repository_live_test.php', 'tests/github_public_transport_test.php', '.github/workflows/publish-signed-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed bundle and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_signed_release.py
  verify-live-import:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: signage_import_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptestpass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, zip, openssl, curl
      - name: Check signed APK import from the actual published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f .release-assets/apk-envelope-manifest.json ]; then echo 'Legacy release; no signed APK envelope'; exit 0; fi
          php -r 'file_put_contents("config/config.php", "<?php return ".var_export(["app_url"=>"http://localhost","db_host"=>"127.0.0.1","db_name"=>"signage_import_test","db_user"=>"root","db_pass"=>"testpass"],true).";");'
          php tests/config_tenant_test.php
          php tests/github_public_transport_test.php
          php tests/apk_repository_live_test.php
          php tests/apk_sports_live_test.php
          php tests/apk_turnos_live_test.php
  verify-clean-install-api22:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Download old and renewed signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-rotation
          gh release download web-v0.4.30 --pattern '2Cam_Digital_Signage_v0.4.21_DEBUG.apk' --dir /tmp/apk-rotation
          gh release download web-v0.4.33 --pattern '2Cam_Digital_Signage_v0.4.22_DEBUG.apk' --dir /tmp/apk-rotation
          python3 -c 'import json,hashlib,pathlib; p=pathlib.Path("/tmp/apk-rotation"); m=json.loads(pathlib.Path(".release-assets/apk-envelope-manifest.json").read_text()); assert hashlib.sha256((p/"2Cam_Digital_Signage_v0.4.22_DEBUG.apk").read_bytes()).hexdigest()==m["sha256"]'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install /tmp/apk-rotation/2Cam_Digital_Signage_v0.4.21_DEBUG.apk
            adb shell dumpsys package com.digitalsignage.tv | grep -F versionName=0.4.21-debug
            adb install -r /tmp/apk-rotation/2Cam_Digital_Signage_v0.4.22_DEBUG.apk > /tmp/rotation.txt 2>&1 || true
            cat /tmp/rotation.txt
            # On older ADB builds the command exit status can be success even
            # when PackageManager prints Failure. Inspect the installed version.
            adb shell dumpsys package com.digitalsignage.tv | grep -F versionName=0.4.21-debug
            echo ROTATION_2026_OLD_SIGNATURE_REJECTED
            adb uninstall com.digitalsignage.tv
            adb install /tmp/apk-rotation/2Cam_Digital_Signage_v0.4.22_DEBUG.apk
            adb shell dumpsys package com.digitalsignage.tv | grep -F versionName=0.4.22-debug
            echo ROTATION_2026_CLEAN_INSTALL_SUCCESS
