name: Validación portal PHP
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'database/**'
      - 'config/**'
      - 'version.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
      - name: Validar PHP
        shell: bash
        run: |
          set -euo pipefail
          test -f version.txt
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app public database -type f -name '*.php' -print0)
      - name: Rechazar datos privados y APK
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config/config.php
          test ! -e public/tv.apk
          test ! -e app/release-assets
          if find . -type f \( -name '*.apk' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'NO incluir credenciales, llaves privadas o APK en el repositorio web.'
            exit 1
          fi
