name: Web portal CI

on:
  push:
    branches: [main, feat/four-modes-parity-v0419]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find app public database -type f -name '*.php' -print0)
      - run: php tests/config_modes_test.php
      - name: Check runtime files absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config/config.php
          test ! -e public/tv.apk
          test ! -e app/release-assets
          if find . -type f \( -name '*.apk' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Error: private keys or APK binaries must not be committed.'; exit 1
          fi
          test -f version.txt

  config-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: signage_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptestpass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, zip, openssl
      - name: Configure isolated database and verify tenant isolation
        run: |
          php -r 'file_put_contents("config/config.php", "<?php return ".var_export(["app_url"=>"http://localhost","db_host"=>"127.0.0.1","db_name"=>"signage_test","db_user"=>"root","db_pass"=>"testpass"],true).";");'
          php tests/config_tenant_test.php
          php tests/device_crud_test.php forged
          php tests/device_crud_test.php identity
          php tests/device_crud_test.php foreign
          php tests/updater_roundtrip_test.php
          php tests/media_formats_test.php
          php tests/playlist_copy_test.php
          php tests/playlist_page_test.php view
          php tests/playlist_page_test.php copy
          php tests/playlist_page_test.php forbidden
          php tests/apk_repository_test.php
